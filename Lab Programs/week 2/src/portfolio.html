<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Govindamma — Profile Card</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #E8E3D6;
    --paper-dark: #DED8C7;
    --ink: #201C17;
    --ink-soft: #4A443B;
    --gold: #A9793F;
    --teal: #2C4A52;
    --line: #C6BEA9;
    --card-w: 380px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.5), transparent 45%),
      var(--paper-dark);
    font-family: 'Inter', sans-serif;
    padding: 40px 20px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 2px);
  }

  .card {
    position: relative;
    width: var(--card-w);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 46px 34px 30px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 30px 60px -20px rgba(32,28,23,0.35),
      0 10px 20px -12px rgba(32,28,23,0.25);
  }

  .stamp {
    position: absolute;
    top: -22px;
    right: 28px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--teal);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.5px;
    transform: rotate(-9deg);
    box-shadow: 0 8px 16px -6px rgba(44,74,82,0.55);
    border: 2px solid var(--paper);
  }
  .stamp::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px dashed rgba(232,227,214,0.55);
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 18px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.1;
    color: var(--ink);
    margin: 0 0 6px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  .role {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 15px;
    color: var(--teal);
    margin: 0 0 20px;
  }

  .bio {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 26px;
  }

  .divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 0 0 22px;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .meta-row span strong {
    display: block;
    color: var(--ink);
    font-size: 12.5px;
    margin-top: 3px;
  }

  .socials {
    display: flex;
    gap: 10px;
  }

  .socials a {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255,255,255,0.35);
    color: var(--ink);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  }

  .socials a svg { width: 14px; height: 14px; flex-shrink: 0; }

  .socials a:hover,
  .socials a:focus-visible {
    background: var(--teal);
    color: var(--paper);
    border-color: var(--teal);
    transform: translateY(-2px);
  }

  .socials a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  @media (max-width: 420px) {
    .card { width: 100%; padding: 40px 24px 26px; }
    .socials { flex-wrap: wrap; }
    .socials a { min-width: 45%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .socials a { transition: none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="stamp">G</div>

    <p class="eyebrow">My Portfolio</p>

    <h1>Govindamma</h1>
    <p class="role">Software Developer</p>

    <p class="bio">
      I am a btech student in anits college pursuing 3rd year in cse. I want to become a software developer.
    </p>

    <hr class="divider">

    <div class="meta-row">
      <span>Based in
        <strong>Vizag, IN</strong>
      </span>
      <span>Available
        <strong>Oct 2026</strong>
      </span>
    </div>

    <div class="socials">
      <a href="mailto:payalagovindamma@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        Email
      </a>
      <a href="https://linkedin.com/in/payalagovindamma" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="10" x2="8" y2="16"/><circle cx="8" cy="7" r="0.6" fill="currentColor"/><path d="M12 16v-3.5c0-1.5 1-2.5 2.3-2.5S16 11 16 12.5V16"/></svg>
        LinkedIn
      </a>
    </div>
  </div>

</body>
</html>
